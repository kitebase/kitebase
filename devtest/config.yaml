# configuration for the app
name: mytestapp
# The name the chrome and the login page show.
title: Devtest
version: 0.0.1
description: "A simple test app"
license: MIT
author: "Claudio Driussi"

# folders which contain plugins (each entry is a *root* holding plugin dirs).
# The shared plugins are reached by path, as any application reaches them: the
# kitebase-commons checkout beside this one, in the workstation layout of
# docs/GETTING_STARTED.md (server/, client/, commons/ side by side). Without it
# the bench does not start, and the error names the path it looked for.
# What devtest adds to them is in its own plugins (devtypes, libapp/library).
plugins:
  - path: ../../commons/plugins
    include: [common, users, acl, settings]
  - plugins
  - plugins/libapp

# the script that loads the app and carries its commands: `kitebase db-check`
# here runs `devtest.py db-check` (default: kite.py)
cli: devtest.py

# Where this application replaces the templates of its guides (`kitebase help`),
# relative to this file: skeleton.html, style.css. The originals are core/<name>.
# help_templates: help/templates

# db engine for sqlalchemy
db_engine: "sqlite:///devtest.sqlite"

# Where uploaded files live (kitebase.media). A column names its root, and
# stores `root:path`; the bytes stay here, out of the database.
media:
  # The engines other than db_engine (chosen by name: --engine, KITEBASE_ENGINE)
  # keep their files in <engines_dir>/<name>/, laid out like this directory:
  # a database and its media are one unit, and two databases never write the
  # same file. Here under data/, out of git; KITEBASE_ENGINES_DIR overrides it.
  engines_dir: data/engines
  roots:
    books:   { type: fs, path: media/books }                         # yyyymm
    records: { type: fs, path: media/records, allocate: by_record }
    cache:   { type: fs, path: media/cache }
  # Where the variants are made, on the first request: it can be emptied.
  cache: cache
  # Sizes a view names (`variant: thumb`), never free in a URL.
  variants:
    thumb:  { fit: 96x96 }
    medium: { fit: 480x480 }
  # What a generated list shows an image column in.
  list_variant: thumb

# Schema alignment (kitebase.schema_sync). The server only ever looks: at startup
# it compares the database with the schema the plugins describe and, on a
# difference, stops ('error', the default), logs ('warn') or says nothing
# ('off'). Changing the database is an explicit command:
#   python devtest.py db-check           what differs (read-only, exit 1 if it does)
#   python devtest.py db-sync --dry-run  the DDL it would run
#   python devtest.py db-sync            apply it — adds only, never drops
migrations:
  on_startup: error

# API configuration
api:
  prefix: "kitebase"  # API prefix - all endpoints will be under /kitebase/* (or use "api/v1" for /api/v1/*, etc.)
  port: 8300         # Default Kitebase server port

# What kitebase is here: the application itself, so its client owns "/" and logs
# people in (kitebase.clientui). An admin of a host would say `role: admin`.
client:
  role: app
  # What the login page shows before anyone is signed in (public, through /info).
  signin:
    subtitle: A Kitebase demo and playground
    hint: "Try admin / admin, or catalog, desk, librarian, stats: the password is the username."

# DataView pagination defaults
# page_size: rows loaded per page (overridable per-view via source.limit in YAML)
# (future) page_size_by_type: per-category overrides matching DATA_MODEL.md §1 tags
#   reference: 500   — small lookup tables, load more at once
#   master:    100   — core entities
#   transaction: 100 — date-stamped records, sorted desc so recent rows come first
#   log:        50   — append-only, can grow large — strict limit
#   detail:    null  — always filtered by parent FK, no limit needed
schema:
  display_field_names: [name, title, description]  # ordered: first match wins

dataview:
  page_size: 100
  reload_all_threshold: 5000   # on refresh: silent restore if rowCount ≤ threshold, banner if above

# Application locale (default 'en' = no translation)
locale: it

# The timezone the stored naive datetimes are written in — the organisation's,
# not the machine's. Declaring it is what asks for the guarantee: `$now` and
# op_date are read through it, and a process whose own clock disagrees refuses
# to start rather than write timestamps that are silently off by an offset.
# Declare nothing and the process clock is used, unchecked, as before.
# In Docker: `environment: TZ=Europe/Rome` on the service.
timezone: Europe/Rome

# Menu — default placement (cascade: item → plugin config → app config).
# Items without an explicit `root` surface in this root. See docs/pending/menu.md §4.
menu:
  default_root: main

# table and fields used for authentication
authentication:
  user_table: User
  username_field: username
  password_field: password
  context_fields: [id, email, is_active, is_admin]
  jwt_expiration_hours: 24           # Token lifetime
  jwt_refresh_interval_minutes: 20   # Auto-refresh after this inactivity

# addiction imports for the source code generator
# source_imports: ['import sys', 'import os']
source_add: |
  def initialize_db(db_url: str):
      from sqlalchemy import create_engine
      engine = create_engine(db_url)
      Base.metadata.create_all(engine)
      return engine


  if __name__ == "__main__":
      initialize_db('sqlite:///:memory:')
