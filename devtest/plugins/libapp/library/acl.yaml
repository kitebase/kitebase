# The roles of the library, for trying access control in devtest.
#
# One user per role in the seed (password = username). The administrator is
# not a role: `is_admin` passes every check. Each role shows something:
#   catalog    the catalogue and nothing of the loans: a smaller menu, and the
#              Loans tab of "Book + reviews" taken out of the page
#   desk       the loans counter: members and loans, books read only, every
#              other table shown by its label; a loan changes or goes only
#              while it is open, a record rule (a returned one answers 403)
#   librarian  both, through `implies`, and every loan: a grant with no
#              condition takes in the desk's; plus the reviews and the demos of
#              the Playground (playground.demos, declared by panels); edits
#              the users and sees their roles, read only: `acl.write`, which
#              changes roles and administrators, stays with the administrator
#   stats      the loans with every label but the members': Loan statistics
#              (stats.yaml) is its page, through a permission no other role
#              holds; the loan list answers 403, and `check` says so beforehand

roles:

  library.catalog:
    label: Cataloguer
    grants:
      - Book.*
      - Author.*
      - Publisher.*
      - BookAuthor.*
      - Review.read
      - '*.label'

  library.desk:
    label: Loans desk
    grants:
      - Loan: [read, create]
      - Loan.update: { where: { returned_at: [is null] } }
      - Loan.delete: { where: { returned_at: [is null] } }
      - LibraryUser.*
      - Book.read
      - Review.read
      - '*.label'

  library.librarian:
    label: Librarian
    implies: [library.catalog, library.desk]
    grants:
      - Loan.*
      - Review.*
      - playground.demos
      - User.*
      - acl.read

  library.stats:
    label: Statistics
    grants:
      - Loan.read
      - library.loan_stats
      - '*.label'
      - '-LibraryUser.label'
