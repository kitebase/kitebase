tables:

  User:
    columns:
      - name: employee_id
        type: ShortStr
        unique: true
        nullable: true

      - name: department
        type: String
        length: 50
        nullable: true

      - name: phone
        type: String
        length: 20
        nullable: true

  Book:
    columns:
      - name: status
        type: String
        length: 1
        default: "'A'"

      - name: isbn
        type: SKU
        length: 50
        unique: false

      # Uploaded before the book is saved too: covers lay out by date.
      - name: cover
        type: Image
        root: covers

      - name: sample
        type: File
        root: covers
        accept: [pdf]
        label: Sample chapter

  Author:
    columns:
      # The folder Author/000/<id>/documents/, read from disk.
      - name: documents
        type: Files
        root: records
        accept: [pdf, jpg, jpeg, png]

  LibraryUser:
    name: library_users
    mixins: [TimeStamp, Credentials]
    columns:
      - name: id
        type: ID

      - name: name
        type: Name
        index: False

      # Laid out by record: uploaded once the reader is saved.
      - name: card
        type: Image
        root: records
        label: Library card

      - name: address
        type: Address
        prefix: a_

      - name: is_student
        label: "Student"
        type: Boolean
        default: False

      - name: membership_number
        type: String
        length: 50
        unique: true
        nullable: true

      - name: membership_date
        type: Date
        nullable: true

      - name: membership_expires
        type: Date
        nullable: true

      - name: phone
        type: Phone
        help: "Contact phone number"

      - name: notes
        type: Text
        nullable: true


  Review:
    name: reviews
    tags: [journal]
    mixins: [TimeStamp]
    columns:
      - name: id
        type: ID

      - name: rating
        type: Integer

      - name: comment
        type: Text

      - name: review_date
        type: Date
        default: $op_date
        nullable: false

      - name: library_user_id
        nullable: false
        foreign_key:
          target: LibraryUser.id

      # A review is edited inside the book's form and still outlives it: lifetime
      # and editing surface are independent axes, and saying so settles the question.
      - name: book_id
        nullable: false
        foreign_key:
          target: Book.id
          owned: false

  Loan:
    name: loans
    tags: [journal]
    mixins: [TimeStamp]
    columns:
      - name: id
        type: ID

      - name: borrowed_at
        type: DateTime
        default: $now
        nullable: false

      - name: due_date
        type: DateTime
        nullable: false

      - name: returned_at
        type: DateTime
        nullable: true

      - name: library_user_id
        nullable: false
        foreign_key:
          target: LibraryUser.id

      # A loan is a journal entry, edited inside the book's form behind a button
      # and not a part of the book: deleting a book leaves its history standing.
      - name: book_id
        nullable: false
        foreign_key:
          target: Book.id
          owned: false
