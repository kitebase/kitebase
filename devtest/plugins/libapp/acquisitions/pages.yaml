# The two documents: a header and its rows. A row of a document opens the
# generated form of its table.

pages:

  purchaseorder_list:
    title: Purchase orders
    content:
      type: table
      source:
        model: PurchaseOrder
        joins:
          - Publisher: "PurchaseOrder.publisher_id = Publisher.id"
        order_by: [-id]
      columns:
        - field: id
        - field: order_date
        - field: Publisher.name as publisher
          title: Publisher
        - field: notes
      # Orders from a spreadsheet (order_import.py): the command asks for the
      # file, and the sheet is written whole or not at all.
      navigator:
        commands:
          - id: import_sheet
            label: Import from spreadsheet
            scope: global
            endpoint: purchase_order_import
          # A new order from this one (orders.py asks whether to copy the lines)
          - id: duplicate
            label: Duplicate
            scope: row
            endpoint: duplicate
            params: { page: purchaseorder_form }

  receipt_list:
    title: Receipts
    content:
      type: table
      source:
        model: Receipt
        joins:
          - Publisher: "Receipt.publisher_id = Publisher.id"
        order_by: [-id]
      columns:
        - field: id
        - field: receipt_date
        - field: Publisher.name as publisher
          title: Publisher
        - field: reference
        - field: notes
      navigator: true

  purchaseorder_form:
    title: Purchase order
    content:
      type: form
      source:
        model: PurchaseOrder
        id: $props.id
        # A new order proposes the discount the installation chose for its
        # lines (settings.yaml); the lines take it from the header.
        defaults:
          default_discount: $setting.acquisitions.default_discount
      # Three steps: the header, the rows, the footer, each judged on the way
      # out (orders.py): the rows against a changed header, the rows
      # themselves, the footer before the save. An error is told on the step
      # where it can be mended.
      phases:
        - id: head
          label: Order
          nodes: [header]
          summary: [id, order_date, publisher_id, supplier_reference]
          next: { endpoint: purchase_order_head, label: Go to the lines }
        - id: lines
          label: Lines
          nodes: [relations]
          next: { endpoint: purchase_order_lines, label: Go to the footer }
        - id: footer
          label: Footer
          nodes: [footer]
          next: { endpoint: purchase_order_close }
      layout:
        - id: header
          type: section
          columns:
            - id: left
              fields:
                - name: id
                  width: 15%
                - name: order_date
                  width: 20%
                - name: publisher_id
                  width: 40%
                - name: supplier_reference
                  width: 20%
                - filler:
                # A help for writing the lines, not a fact of the order: no
                # column holds it, the new lines take it (prefill below).
                - name: default_discount
                  label: Discount for new lines
                  type: Number
                  transient: true
                  width: 20%
                - name: notes

        - id: footer
          type: section
          columns:
            - id: footer_left
              fields:
                - name: expected_delivery
                  width: 25%
                - name: footer_discount

        # In a tabs even alone: the hook another plugin needs to add a
        # sibling collection (the payment terms of an order, say).
        - id: relations
          type: tabs
          pages:
            - id: lines_tab
              label: Lines
              count: lines
              layout:
                - type: collection
                  id: lines
                  model: PurchaseOrderLine
                  fk: purchase_order_id
                  # The order of the lines is the buyer's: moved by hand, numbered on save
                  sequence: sequence
                  prefill:
                    discount: $record.default_discount
                  view:
                    type: table
                    columns:
                      - field: book_id.title
                        title: Book
                        width: 320
                      - field: quantity
                        title: Quantity
                      - field: price
                        title: Price
                      - field: discount
                        title: Discount
                    # On the draft, not the database (orders.py): the ticked
                    # lines, or all of them, until the order is saved.
                    navigator:
                      commands:
                        - id: discount_lines
                          label: Discount on lines
                          scope: global
                          endpoint: purchase_order_discount
                        - id: sort_by_publication
                          label: Sort by publication date
                          scope: global
                          endpoint: purchase_order_sort_by_publication

  receipt_form:
    title: Receipt
    content:
      type: form
      source:
        model: Receipt
        id: $props.id
      # The same two steps with nothing to judge in between: phases are a
      # layout first, the handler is optional.
      phases:
        - id: head
          label: Delivery
          nodes: [header]
          summary: [id, receipt_date, publisher_id, reference]
        - id: lines
          label: Lines
          nodes: [relations]
      layout:
        - id: header
          type: section
          columns:
            - id: left
              fields:
                - name: id
                  width: 15%
                - name: receipt_date
                  width: 20%
                - name: publisher_id
                  width: 40%
                - name: reference
                  width: 20%
                - filler:
                - name: notes

        # In a tabs even alone: the hook another plugin needs to add a
        # sibling collection (the payment terms of an order, say).
        - id: relations
          type: tabs
          pages:
            - id: lines_tab
              label: Lines
              count: lines
              layout:
                - type: collection
                  id: lines
                  model: ReceiptLine
                  fk: receipt_id
                  sequence: sequence
                  view:
                    type: table
                    columns:
                      - field: book_id.title
                        title: Book
                        width: 320
                      - field: quantity
                        title: Quantity
                      - field: purchase_order_line_id
                        title: Order row

views:

  # What "Discount on lines" asks (orders.py, purchase_order_discount)
  purchaseorder_discount:
    type: form
    presentation: dialog
    source: {}
    layout:
      - type: section
        id: discount
        fields:
          - name: discount
            label: Discount %
            type: Number
            required: true

  # What a duplicate of an order asks first (orders.py, order_duplicate). The
  # date is proposed from the order copied: a month after it.
  purchaseorder_duplicate:
    type: form
    presentation: dialog
    source: {}
    layout:
      - type: section
        id: duplicate
        fields:
          - name: order_date
            label: Order date
            type: Date
            required: true
          - name: lines
            label: Copy the lines
            type: Boolean
            default: true
