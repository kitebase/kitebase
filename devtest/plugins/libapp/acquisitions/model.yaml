# Buying books: an order to a publisher, and what arrives against it.
#
# A bench for the document form (header, rows, phases, commands on the rows),
# not a purchasing module: quantities are numbers, nothing counts copies or
# stock, and what is still to arrive is reckoned from the rows. The supplier
# is the publisher, so the plugin needs nothing beyond the catalogue.

tables:

  PurchaseOrder:
    name: purchase_orders
    help: An order to one publisher for the books the library wants to buy.
    doc: |
      A bench for the document form (header, rows, phases, commands on the
      rows), not a purchasing module: quantities are numbers and nothing counts
      copies or stock.
    tags: [journal]
    mixins: [TimeStamp]
    # The board of the orders: one column per status, fixed by the code
    state: status
    columns:
      - name: id
        type: ID
        label: Number

      - name: order_date
        type: Date
        label: Date
        help: The date of the order. A new order starts from the working date.
        doc: Not duplicated, because a copy is a new order with a date of its own.
        default: $op_date
        nullable: false
        duplicate: false

      - name: publisher_id
        label: Publisher
        help: The publisher the books are ordered from.
        nullable: false
        foreign_key:
          target: Publisher.id

      - name: payment_method_id
        label: Payment
        help: "How the order is paid: type its code, like WT, or search by name."
        nullable: true
        foreign_key:
          target: PaymentMethod.id

      - name: supplier_reference
        type: String
        label: Supplier reference
        help: "The publisher's own reference: their quote, or the sheet they sent."
        length: 50
        nullable: true
        duplicate: false

      - name: notes
        type: Text
        label: Notes
        nullable: true

      - name: expected_delivery
        type: Date
        label: Expected delivery
        help: When the books should arrive. It cannot come before the date of the order.
        nullable: true
        duplicate: false

      - name: footer_discount
        type: Percent
        label: Discount on the order
        help: A discount on the whole order, beside the discount of each line.
        nullable: true

      - name: status
        type: ShortStr
        label: Status
        help: Where the order stands, from written to fulfilled.
        default: "'draft'"
        nullable: false
        duplicate: false
        choices:
          - { value: draft, label: To send }
          - { value: sent, label: Sent }
          - { value: accepted, label: Accepted }
          # Some titles are being reprinted: accepted, but not all can ship yet
          - { value: waiting, label: Waiting for reprints }
          - { value: fulfilled, label: Fulfilled }

  # A small table typed by hand, with a code: the bench of `code_field`, which
  # replaces the id in every exact match (typing 30 finds the code 30, never
  # the record numbered 30).
  PaymentMethod:
    name: payment_methods
    label: Payment method
    help: The ways an order can be paid.
    tags: [reference]
    code_field: code
    columns:
      - name: id
        type: ID

      - name: code
        type: UpperCode
        label: Code
        help: A short code, typed in place of the name.
        nullable: false
        unique: true

      - name: name
        type: Description
        label: Name
        nullable: false

  PurchaseOrderLine:
    name: purchase_order_lines
    columns:
      - name: id
        type: ID

      - name: purchase_order_id
        doc: A part of its order, which goes when the order goes.
        nullable: false
        foreign_key:
          target: PurchaseOrder.id
          owned: true

      - name: sequence
        type: Sequence
        doc: The place of the row in its document, which the reader chose.

      - name: book_id
        label: Book
        help: A book of the order's publisher.
        nullable: false
        foreign_key:
          target: Book.id

      - name: quantity
        type: Quantity
        nullable: false

      - name: price
        type: Price
        nullable: true

      - name: discount
        type: Percent
        help: The discount on this line. A new line starts from the discount set in the header.
        nullable: true

  Receipt:
    name: receipts
    tags: [journal]
    mixins: [TimeStamp]
    columns:
      - name: id
        type: ID
        label: Number

      - name: receipt_date
        type: Date
        label: Date
        default: $op_date
        nullable: false

      - name: publisher_id
        label: Publisher
        nullable: false
        foreign_key:
          target: Publisher.id

      # The number on the publisher's delivery note.
      - name: reference
        type: String
        label: Delivery note
        length: 50
        nullable: true

      - name: notes
        type: Text
        label: Notes
        nullable: true

  ReceiptLine:
    name: receipt_lines
    columns:
      - name: id
        type: ID

      - name: receipt_id
        nullable: false
        foreign_key:
          target: Receipt.id
          owned: true

      - name: sequence
        type: Sequence

      - name: book_id
        label: Book
        nullable: false
        foreign_key:
          target: Book.id

      - name: quantity
        type: Quantity
        nullable: false

      # The order row this one fills, when it fills one: a book can also
      # arrive that nobody ordered. The order outlives its receipts and the
      # other way round, so neither deletes the other. No form fills it: the
      # seed does, as the case for the receipt against the orders (README,
      # "Still to come").
      - name: purchase_order_line_id
        label: Order row
        nullable: true
        foreign_key:
          target: PurchaseOrderLine.id
          owned: false
