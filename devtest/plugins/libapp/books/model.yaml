tables:

  Author:
    name: authors
    help: A writer of the catalogue, with the dates and the biography.
    tags: [anag]
    display_field: full_name
    search_fields: [first_name, last_name]
    columns:
      - name: id
        type: ID

      - name: first_name
        type: Name
        nullable: false

      - name: last_name
        type: Name
        nullable: false

      - name: birth_date
        type: Date
        nullable: true

      - name: death_date
        type: Date
        nullable: true

      - name: nationality
        type: String
        length: 50

      - name: wikidata
        type: String
        length: 20
        nullable: true
        label: Wikidata
        help: "The author's item on Wikidata, such as Q154756: it is how the biography is found."
        doc: The key the biography and the dates are looked up by, since a name is no key.

      - name: bio
        type: Text
        nullable: true
        label: Biography
        help: The text the Fetch biography command loads, which you can then change.

      - name: full_name
        type: String
        virtual: true
        editable: false
        label: "Full Name"

    # Compound indexes for better query performance
    indexes:
      - name: idx_author_fullname
        columns: [first_name, last_name]
        description: "Search authors by full name"

      - name: idx_author_nationality
        columns: [nationality, last_name]
        description: "Authors by country"

  Publisher:
    name: publishers
    tags: [anag]
    columns:
      - name: id
        type: ID

      - name: name
        type: String
        length: 100
        nullable: false
        index: true

      - name: country
        type: String
        length: 2
        nullable: true
        description: "ISO 3166-1 alpha-2 (US, GB, IT, FR)"

      - name: website
        type: String
        length: 200
        nullable: true

  Book:
    name: books
    help: A book of the catalogue, one row per title, with the data of this edition.
    doc: |
      One row per title. The library plugin adds the columns it needs to lend
      and show a book (status, cover, sample) to this same table.
    tags: [anag]
    mixins: [Archivable]
    columns:
      - name: id
        type: ID

      - name: title
        type: Description
        index: True

      - name: original_title
        type: Description
        nullable: true
        help: The title of the work, when this edition is a translation or carries another.

      - name: first_published
        type: Integer
        nullable: true
        label: First published
        help: The year the work first came out, not the year of this edition.

      - name: isbn
        type: String
        length: 50
        nullable: false
        unique: false

      - name: publication_date
        type: Date
        nullable: true
        default: null
        help: When this edition came out.

      - name: price
        type: Price

      - name: language
        type: String
        length: 2
        nullable: true
        index: true
        description: "ISO 639-1 (en, it, fr, es, de)"
        help: "The language of this edition, as a two-letter code: en, it, fr."

      - name: pages
        type: Integer
        nullable: true

      - name: publisher_id
        type: Integer
        nullable: true
        label: Publisher
        help: The publisher of this edition.
        foreign_key:
          target: Publisher.id

      - name: description
        type: Text
        nullable: true

      - name: tags
        type: String
        length: 200
        nullable: true
        description: "Comma-separated tags (first = primary genre)"
        help: Tags separated by commas. The first one is the main genre.

    # Compound indexes
    indexes:
      - name: idx_book_isbn
        columns: [isbn]
        unique: false
        description: "ISBN index (non-unique for testing)"

      - name: idx_book_title_date
        columns: [title, publication_date]
        description: "Search books by title and year"

  BookAuthor:
    name: books_authors
    columns:
      - name: notes
        type: String
        help: A note on the part of this author in the book, such as translator or editor.
    many_to_many:
      target1:
        table: Book.id
        column: book_id
      target2:
        table: Author.id
        column: author_id
