pages:

  # The generated list of the authors, with one command on top of it: the
  # biography from Wikipedia, through the author's Wikidata id (lookup.py).
  author_list:
    $auto: true
    content:
      navigator:
        commands:
          - id: fetch_bio
            label: Fetch biography
            help: Looks up the biography on Wikipedia, through the Wikidata item of the author.
            scope: row
            endpoint: author_fetch_bio
