# Panel descriptor protocol — test / fake data
#
# Root keys:
#   panels:   keyed by panel_id — stack pages (layout + content + split areas)
#   views:    keyed by view_id  — renderable units (table, form, kanban, ...)
#
# Merge behavior (PluginsManager):
#   Both are dicts keyed by id → deep_merge per plugin priority works naturally.
#   A plugin can override any specific panel/view without touching the others.

pages:

  # ── Book Detail Demo — Layout A: bottom spans full width ─────────────────
  #    panels order: [detail(right), bottom] → last=bottom is outermost
  #    ┌────────────────┬──────────┐
  #    │  Book table    │  detail  │
  #    ├────────────────┴──────────┤
  #    │         bottom            │
  #    └───────────────────────────┘
  book_demo_bottom_full:
    title: Book Demo — bottom full width
    content:
      $ref: "views.book_list_view"
    panels:
      - id: detail
        pos: right
        width: 400
        type: plugin
        component: library.hello
        props:
          message: "Book detail form (DataForm — coming next)"
          userName: "Detail"
      - id: bottom
        pos: bottom
        height: 250
        type: plugin
        component: library.hello
        props:
          message: "Loans / Reviews tabs (TabView — coming next)"
          userName: "Bottom Tabs"

  # ── Nested splits stress test ────────────────────────────────────────────
  #    Layout A base (bottom full width) with sub-splits in both side areas:
  #
  #    ┌─────────────────┬────────────────────┐
  #    │                 │   Detail-A (top)   │
  #    │   Book table    ├────────────────────┤
  #    │                 │   Detail-B (bot)   │
  #    ├──────────┬──────┴────────────────────┤
  #    │ Bottom-A │        Bottom-B           │
  #    └──────────┴──────────────────────────┘
  #
  #    detail area  → horizontal gutter (top/bottom via pos:bottom)
  #    bottom area  → vertical gutter   (left/right via pos:right)
  book_demo_nested:
    title: Book Demo — Nested Splits
    content:
      $ref: "views.book_list_view"
    panels:
      - id: detail
        pos: right
        width: 420
        content:
          type: plugin
          component: library.hello
          props:
            message: "Detail — top half (DataForm coming next)"
            userName: "Detail-A"
        panels:
          - id: detail_bottom
            pos: bottom
            height: 180
            type: plugin
            component: library.hello
            props:
              message: "Detail — bottom half (related data)"
              userName: "Detail-B"
      - id: bottom
        pos: bottom
        height: 280
        content:
          type: plugin
          component: library.hello
          props:
            message: "Bottom — left half (Loans)"
            userName: "Bottom-A"
        panels:
          - id: bottom_right
            pos: right
            width: 360
            type: plugin
            component: library.hello
            props:
              message: "Bottom — right half (Reviews)"
              userName: "Bottom-B"

  # ── Book Detail Demo — Layout B: right spans full height ─────────────────
  #    panels order: [bottom, detail(right)] → last=detail is outermost
  #    ┌────────────────┬──────────┐
  #    │  Book table    │          │
  #    ├────────────────┤  detail  │
  #    │     bottom     │          │
  #    └────────────────┴──────────┘
  book_demo_right_full:
    title: Book Demo — right full height
    content:
      $ref: "views.book_list_view"
    panels:
      - id: bottom
        pos: bottom
        height: 250
        type: plugin
        component: library.hello
        props:
          message: "Loans / Reviews tabs (TabView — coming next)"
          userName: "Bottom Tabs"
      - id: detail
        pos: right
        width: 400
        type: plugin
        component: library.hello
        props:
          message: "Book detail form (DataForm — coming next)"
          userName: "Detail"

  # ── Minimal panel: inline view, no splits ────────────────────────────────
  book_list:
    title: Books
    content:
      $ref: "views.book_list_view"

  # ── Panel with a split area on the right ─────────────────────────────────
  book_detail:
    title: Book
    breadcrumb: "$props.title"     # uses $props passed via stack.push
    confirm_on_leave: true
    content:
      $ref: "views.book_edit_view"
    panels:
      - id: authors
        pos: right
        width: 320
        collapsed: false
        trigger:
          event: form_load            # fires when the form loads a record
          pass: [id]
        $ref: "views.book_authors_view"

  # ── Aggregate bench: a book and its authors, written as one tree ─────────
  #    The collection node declares what gets written — the table and the column
  #    that points back at the book — while `view` only says how it looks. The
  #    row form is left to default to BookAuthor_form, which auto-generates:
  #    the bench works before anyone writes a descriptor for it.
  book_form:
    title: Book
    content:
      type: form
      source:
        model: Book
        id: $props.id
      layout:
        # Every container carries an `id`: it is what lets another plugin refine
        # *this* section instead of appending a second one — a list whose items have
        # no identity can only be extended (`merge-unkeyed-list`).
        #
        # A column lays its fields left to right and wraps when they no longer
        # fit: a field with no width takes an equal share of what is left, so
        # five of them end up on one line. `width` pins a size and `filler` is a
        # zero-height item that fills the line, pushing what follows onto the
        # next one — the line break of this layout.
        - id: identity
          type: section
          columns:
            - id: left
              fields:
                - name: title
                  width: 55%
                - name: isbn
                  width: 25%
                - filler:
                # A hand-written field carries no column attributes, so the FK is
                # declared here: without a target the widget has nothing to look
                # up, and `combobox` alone drew an empty picklist.
                - name: publisher_id
                  widget: fk
                  foreign_key:
                    target: Publisher
                    field: id
                  width: 35%
                - name: publication_date
                  width: 20%
                - name: price
                  width: 15%

        # The media bench: a cover uploaded on a new book too, a PDF that
        # opens in the browser's viewer. A section of its own, so the fields
        # above keep the full width.
        - id: media
          type: section
          label: Files
          columns:
            - id: files
              fields:
                - name: cover
                - name: sample

        # ── Buttons: a face of this buffer, or something to do ──────────────
        #    A button opens what belongs to the record being edited, and never
        #    another record — the FK combobox already carries that gesture
        #    (relations.md §19.1). Three shapes, side by side.
        - id: actions
          type: row
          children:
            - id: loans_col
              type: col
              layout:
                # The loans are an annex: a book is a book without them, so they
                # sit behind a button instead of taking vertical space. `count`
                # reads the buffer, so the label says whether it is worth opening.
                - type: button
                  label: Loans
                  icon: book-open-check
                  count: true
                  opens:
                    type: collection
                    id: loans
                    model: Loan
                    fk: book_id
                    view:
                      type: table
                      columns:
                        - field: borrowed_at
                          title: Borrowed
                        - field: due_date
                          title: Due
                        - field: returned_at
                          title: Returned
                        - field: library_user_id.name
                          title: Member

            - id: description_col
              type: col
              layout:
                # The same record with other fields, by reference: the long text
                # would eat the form, and it is read far less often than the rest.
                - type: button
                  label: Description & tags
                  icon: text
                  opens:
                    type: form
                    page: book_description_form

            - id: stats_col
              type: col
              layout:
                # The other family: no frame, no buffer — it calls and reports.
                - type: button
                  label: Statistics
                  icon: chart-column
                  endpoint: book_stats
                  pass:
                    id: $record.id

        # An inline collection lives in a `tabs` even when it is the only one:
        # it is the hook a derived application needs to put a sibling next to it
        # (PLUGIN_MODEL § 2.5), and `bookshop` uses exactly this one to add its
        # Reviews tab. Alone, the strip would read as a mistake, so a single page
        # wears the label of a band — the same call `TabView` makes for a panel
        # area. `count` answers what an empty tab costs to discover: a click.
        - id: relations
          type: tabs
          pages:
            - id: authors_tab
              label: Authors
              count: authors
              layout:
                - type: collection
                  id: authors
                  model: BookAuthor
                  fk: book_id
                  view:
                    type: table
                    columns:
                      # A bare key is a value and costs nothing; a path asks for
                      # the name behind it. Both are declared here to show that
                      # they are separate columns, and that neither is implied.
                      - field: author_id
                        title: Id
                        width: 70
                      - field: author_id.full_name
                        title: Author
                      - field: notes
                        title: Notes

      actions:
        toolbar: [save, cancel]
      policy:
        editable: true

  # ── A face of `book_form`, opened by a button ────────────────────────────
  #    Same record, other fields. It declares `source.model` like any form, but
  #    the frame hands it the parent's live draft and never reads the database:
  #    a value typed upstairs and not yet saved is what must appear here. On
  #    confirm the values go back into that draft, so a field drawn in both
  #    places refreshes without a round-trip.
  book_description_form:
    title: Description & tags
    content:
      type: form
      source:
        model: Book
      layout:
        - id: publishing
          type: section
          columns:
            - id: left
              fields:
                - name: language
                  width: 20%
                - name: pages
                  width: 20%
                - filler:
                - name: tags
                - filler:
                - name: description
                  widget: textarea
      policy:
        button_style: label

  # ── Panel cascade: content → lines → line_detail ─────────────────────────
  loan_manager:
    title: Loans
    content:
      $ref: "views.loan_list_view"
    panels:
      - id: detail
        pos: right
        width: 380
        trigger:
          event: row_click            # fires when user clicks a row
          from: content               # default, explicit here for clarity
          pass: [id]
        $ref: "views.loan_detail_view"


views:

  # ── Table view: simple, FK join via dot notation ──────────────────────────
  book_list_view:
    type: table
    source:
      model: Book
      joins:
        - Publisher: "Book.publisher_id = Publisher.id"
      order_by: [title]
    columns:
      - field: id
      # The rendition the server makes on the first request, never the original.
      - field: cover
        variant: thumb
        width: 64
      - field: title
      - field: Publisher.name      # joined field — Model.field notation
        title: Publisher
      - field: price
        align: center
        formatter: price_color
      - field: status
      # The cover again, larger, for the cards: an alias carries its own
      # variant, and the grid does not show it.
      - field: cover as card_cover
        variant: medium
        visible: false
    # The same rows as tiles. A card names columns of the view by key; a photo
    # dropped on a card's image replaces the cover.
    allow_views: [table, cards]
    card:
      image: card_cover
      title: title
      subtitle: name
      details: [price, status]
    # One entry point for everything Archivable offers, in the [⚡] menu: the
    # server answers with a menu of its own (active / archived / all, and the
    # verb that fits the active row). Book carries the mixin; the command is
    # declared here because a mixin's commands are not injected (navigator.md
    # §4h). `key` runs it from the keyboard while the grid has the focus.
    navigator:
      commands:
        - id: archive
          label: Archive
          scope: global
          key: a
          endpoint: archivable
    actions:
      row:
        - id: edit
          action: stack_push
          panel: book_detail
          pass: [id, title]
        - id: delete
          action: endpoint
          op: db
          params: {table: Book, method: delete}
          confirm: true

  # ── Form view: groups, FK widget, $props.id for new/edit ─────────────────
  book_edit_view:
    type: form
    source:
      model: Book
      id: $props.id                # null → new record; int → load existing
    fields:
      - name: title
      - name: isbn
      - name: publisher_id
        widget: combobox           # FK widget
      - name: publication_date
      - name: price
      - group: Details
        fields:
          - name: language
          - name: pages
          - name: tags
          - name: description
            widget: textarea
    actions:
      toolbar: [save, cancel]

  # ── Read-only form view: detail panel ─────────────────────────────────────
  book_detail_view:
    type: form
    source:
      model: Book
      id: $trigger.id              # set from trigger (row_click event)
    fields:
      - name: cover
      - name: title
      - name: isbn
      - name: publisher_id
      - name: publication_date
      - name: price
    policy:
      editable: false

  # ── Table view: M2M join via explicit join chain ───────────────────────────
  book_authors_view:
    type: table
    source:
      model: Author
      joins:
        - via: BookAuthor          # M2M: Author ← BookAuthor.author_id
          where: [BookAuthor.book_id = $trigger.id]
      order_by: [Author.last_name]
    columns:
      - field: Author.last_name
        title: Last Name
      - field: Author.first_name
        title: First Name
      - field: Author.nationality
    policy:
      editable: false
      selection: false

  # ── Table view with two FK joins ──────────────────────────────────────────
  loan_list_view:
    type: table
    source:
      model: Loan
      joins:
        - Book: "Loan.book_id = Book.id"
        - LibraryUser: "Loan.library_user_id = LibraryUser.id"
      order_by: [-borrowed_at]     # minus prefix = descending
    columns:
      - field: LibraryUser.name
        title: User
      - field: Book.title
        title: Book
      - field: borrowed_at
      - field: due_date
      - field: returned_at
    navigator:
      commands:
        # The ticket printed when a loan is made (library/loans.py), again on demand
        - id: print_ticket
          label: Print ticket
          scope: row
          endpoint: loan_print_ticket
    actions:
      toolbar: [add, search, export]
      row:
        - id: edit
          action: stack_push
          panel: loan_manager
          pass: [id]

  # ── Form view: trigger-based loading ──────────────────────────────────────
  loan_detail_view:
    type: form
    source:
      model: Loan
      id: $trigger.id
      joins:
        - Book: "Loan.book_id = Book.id"
        - LibraryUser: "Loan.library_user_id = LibraryUser.id"
    fields:
      - name: library_user_id
        widget: combobox
      - name: book_id
        widget: combobox
      - name: borrowed_at
      - name: due_date
      - name: returned_at
    policy:
      editable: false
