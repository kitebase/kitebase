types:

  ID:
    base: Integer
    primary_key: True
    autoincrement: True
    label: "Unique Identifier"
    help: |
      The primary key for the table

  ShortID:
    base: String
    length: 32
    primary_key: True
    label: "Unique Identifier"
    help: |
      The primary key for the table

  ShortStr:
    base: String
    length: 32

  SKU:
    base: ShortStr
    nullable: False

  UpperStr:
    base: ShortStr
    case: upper

  UpperCode:
    base: UpperStr
    index: True

  Description:
    base: String
    nullable: False

  Name:
    base: Description
    index: True

  Password:
    base: String
    nullable: False
    widget: password
    label: "Password"
    help: |
      Please insert a robust password and keep it safe
    # Never leaves the server, and is hashed on the way in. Empty on write means
    # "unchanged" — the client has no way of echoing back what it cannot read.
    secret: true
    on_write: password_hash

  Email:
    base: String
    widget: email
    validate: email_validator

  Json:
    base: JSON
    widget: json
    default: {}
    nullable: True

  Markdown:
    base: Text
    widget: markdown

  Phone:
    base: String
    widget: tel
    length: 20
    nullable: true

  URL:
    base: String
    widget: url
    length: 512
    nullable: true

  Color:
    base: String
    widget: color
    length: 7
    nullable: true
    label: "Color"
    help: "Hex color code (e.g., #FF5733)"

  FilePath:
    base: String
    widget: filepath
    length: 512
    nullable: true
    label: "File Path"
    help: "Path to uploaded file or resource"

  Money:
    base: Numeric
    widget: currency
    precision: 10
    scale: 2
    nullable: true

  Price:
    base: Money
    widget: currency
    precision: 10
    scale: 4

  TimeStamp:
    label: "Timestamp"
    columns:
      # `$now` and not `datetime.now`: the same instant, read through the
      # timezone the app declares rather than the one the process happens to
      # run in (kitebase.apptime). It is also the single place that answers
      # "when is now", so moving the storage to UTC one day is one function.
      - name: created_at
        type: DateTime
        granularity: second
        default: $now
        deferred: true          # audit: filled at save, not prefilled in the form
        nullable: False
      - name: updated_at
        type: DateTime
        granularity: second
        default: $now
        onupdate: $now
        deferred: true          # audit: filled at save, not prefilled in the form
        nullable: False

  Address:
    label: "Address"
    columns:
      - name: address
        type: String
        nullable: True
      - name: city
        type: String
        nullable: True
      - name: state
        type: String
        nullable: True
      - name: zip
        type: String
        nullable: True
      - name: country
        type: String
        nullable: True

  Archivable:
    label: "Archivable"
    columns:
      - name: active
        type: Boolean
        default: true
        nullable: false
        label: "Active"

  Credentials:
    label: "Authentication Credentials"
    columns:
      - name: username
        type: ShortStr
        unique: true
        nullable: false
        label: "Username"
        help: "Unique login username"
      - name: password
        type: Password
        label: "Password"
      - name: email
        type: Email
        unique: true
        nullable: false
        label: "Email"
      - name: is_active
        type: Boolean
        default: true
        nullable: false
        label: "Active"
      - name: last_login
        type: DateTime
        nullable: true
        label: "Last Login"

tables:

  Config:
    name: configs
    label: "Configuration"
    help: |
      Wide app configuration file
    tags: [short]

    columns:
      - name: id
        type: ShortID

      - name: description
        type: Description

      - name: group
        type: ShortStr

      - name: help
        type: Markdown

      - name: value
        type: String

      - name: values
        type: Json
