# Kitebase — packaging.
#
# The library is installed, never copied: an application declares it as a
# dependency and pins a version, so what is running is a fact the application
# states rather than whatever happened to be on the machine.
#
#   uv add "kitebase @ git+https://github.com/kitebase/kitebase@v0.5.0"
#   uv add "kitebase @ git+file:///path/to/kitebase"        # a local checkout
#   uv pip install -e ../kitebase                          # editable, for dev
#
# The version lives in `kitebase/__init__.py` and is read from there: one place
# to bump, and `import kitebase; kitebase.__version__` always agrees with what
# pip reports.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kitebase"
dynamic = ["version"]
description = "Plugin-based, data-driven framework: YAML schema to SQLAlchemy models, endpoints and auto-generated UI"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Claudio Driussi", email = "claudio.driussi@gmail.com" }]
keywords = ["sqlalchemy", "orm", "code-generation", "plugins", "data-driven", "admin"]

# 3.11 rather than the 3.10 the syntax would allow: two steps of margin below
# what is actually tested, and no promise that cannot be kept.
requires-python = ">=3.11"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]

# What `import kitebase` needs, and nothing else. The package auto-imports its
# own modules, so anything imported at module level is a hard requirement:
# sqlalchemy (db), pyyaml (plugins), pyjwt (server_utils), bcrypt (transforms).
dependencies = [
    "sqlalchemy>=2.0",
    "pyyaml",
    "pyjwt",
    "bcrypt",
    # Schema comparison: db-check, db-sync, and the startup guard, which is on
    # by default. Only the comparison is borrowed — no revision files, no
    # migration history: the YAML is the truth (see kitebase/schema_sync.py).
    "alembic",
]

# The web frameworks are imported inside the registration functions, never at
# module level: an application installs the one it serves with, and kitebase
# does not drag the other into its environment.
[project.optional-dependencies]
flask = ["flask>=3.0"]
fastapi = ["fastapi", "uvicorn"]
dev = ["pytest", "flask>=3.0", "fastapi", "uvicorn", "httpx"]

[project.urls]
Homepage = "https://github.com/kitebase/kitebase"
Source = "https://github.com/kitebase/kitebase"
Issues = "https://github.com/kitebase/kitebase/issues"

[project.scripts]
kitebase = "kitebase.cli:main"

[tool.hatch.version]
path = "kitebase/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["kitebase"]
# Working notes live inside the package directory and are not part of it.
exclude = ["_notes", "**/__pycache__"]

[tool.hatch.build.targets.sdist]
include = ["kitebase", "README.md", "CHANGELOG.md", "LICENSE"]
