pages.*.panels[].panels[]: [component, height, id, pos, props, type, width]
pages.*.panels[].panels[].props: '*'
pages.*.panels[].props: '*'
pages.*.panels[].tabs[]: [id, label]
pages.*.panels[].trigger: [event, from, pass]
schemas.*: '*'
schemas.*.*: [scale, type]
