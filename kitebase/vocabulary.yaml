pages.*.content.layout[].pages[].layout[].view.source: [order_by]
pages.*.content.navigator: [commands]
pages.*.content.navigator.commands[]: [endpoint, id, key, label, scope]
pages.*.content.policy: [button_style, editable]
pages.*.content.props: '*'
